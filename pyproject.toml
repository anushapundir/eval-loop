[project]
name = "eval-loop-agent"
version = "0.1.0"
description = "A self-improving agent with an evaluation-driven feedback loop."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "streamlit>=1.36",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "evaluators", "feedback", "storage", "reports", "app", "ui", "config"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
